name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
      - name: Build Windows package
        env:
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="EverythingShare-${GITHUB_REF_NAME}-windows-${GOARCH}"
          mkdir -p "dist/${package}"
          go build -trimpath -ldflags="-s -w -X main.version=${version}" -o "dist/${package}/EverythingShare.exe" .
          cp "packaging/windows/Start EverythingShare.cmd" "dist/${package}/"
          cp docs/windows-quickstart.zh-CN.md docs/windows-quickstart.en.md LICENSE "dist/${package}/"
          cd dist
          zip -9 -r "${package}.zip" "${package}"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  windows-oneclick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
      - name: Fetch and verify official Everything portable payload
        run: |
          archive="Everything-1.4.1.1032.x64.zip"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "/tmp/${archive}" \
            "https://www.voidtools.com/${archive}"
          echo "698df475ec44e638f66f1b6a32d28fea613cec78d3b6310e6abe53431eeb940c  /tmp/${archive}" | sha256sum --check --strict
          unzip -p "/tmp/${archive}" everything.exe > third_party/everything/Everything.exe.bin
          echo "f191f756996a14a11e5445fa7103d302efd510cf2fbf920e6c0c8ed51d512e36  third_party/everything/Everything.exe.bin" | sha256sum --check --strict
      - name: Build one-file package for PCs without Everything
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          output="EverythingShare-OneClick-windows-x64.exe"
          go build -tags bundled_everything -trimpath \
            -ldflags="-s -w -X main.version=${version}" \
            -o "dist/${output}" .
      - uses: actions/upload-artifact@v7
        with:
          name: windows-oneclick
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: [windows, windows-oneclick]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: windows-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum ./*.zip ./*.exe > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "EverythingShare ${GITHUB_REF_NAME}" \
            --generate-notes
