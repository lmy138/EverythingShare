name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: Build Windows package
        env:
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="EverythingShare-${GITHUB_REF_NAME}-windows-${GOARCH}"
          mkdir -p "dist/${package}"
          go build -trimpath -ldflags="-s -w -X main.version=${version}" -o "dist/${package}/EverythingShare.exe" .
          cp "packaging/windows/Start EverythingShare.cmd" "dist/${package}/"
          cp docs/windows-quickstart.zh-CN.md docs/windows-quickstart.en.md LICENSE "dist/${package}/"
          cd dist
          zip -9 -r "${package}.zip" "${package}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum ./*.zip > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "EverythingShare ${GITHUB_REF_NAME}" \
            --generate-notes
