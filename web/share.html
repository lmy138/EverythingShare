<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>文件分享</title>
  <link rel="icon" type="image/svg+xml" href="/assets/app-icon.svg">
  <link rel="stylesheet" href="/assets/app.css?v=baidu-2">
</head>
<body data-token="{{TOKEN}}">
  <main class="shell">
    <section id="verifyCard" class="card verify">
      <div class="brand">
        <a class="brand-mark brand-home" href="/" aria-label="返回首页"><img src="/assets/app-icon.svg" alt=""></a>
        <div><h1>访问文件分享</h1><p class="muted">请输入分享者提供的提取码</p></div>
      </div>
      <form id="verifyForm">
        <div class="field">
          <label for="code">提取码</label>
          <input id="code" class="code-input" name="code" minlength="4" maxlength="12" autocomplete="one-time-code" autocapitalize="characters" required>
        </div>
        <div class="actions"><button class="primary" type="submit">查看分享</button></div>
        <p id="verifyMessage" class="message" role="alert"></p>
      </form>
    </section>

    <section id="shareCard" class="card hidden">
      <header class="share-head">
        <div>
          <div class="brand"><a class="brand-mark brand-home" href="/" aria-label="返回首页"><img src="/assets/app-icon.svg" alt=""></a><h1 id="shareTitle">文件分享</h1></div>
          <div class="stats"><span id="shareExpiry" class="stat"></span><span id="shareDownloads" class="stat"></span></div>
        </div>
        <button id="systemShare" class="secondary" type="button">分享链接</button>
      </header>
      <div id="folderToolbar" class="toolbar hidden">
        <button id="goUp" class="secondary" type="button">返回上级</button>
        <div id="breadcrumb" class="breadcrumb">根目录</div>
        <label class="select-page"><input id="selectPage" type="checkbox"> 全选当前目录</label>
        <span id="selectedCount" class="selection-count">已选 0 项</span>
        <button id="clearSelection" class="secondary" type="button" disabled>清除选择</button>
        <button id="downloadSelected" class="primary" type="button" disabled>下载所选</button>
        <button id="downloadZip" class="secondary" type="button">下载全部</button>
      </div>
      <div id="singleFile" class="toolbar hidden">
        <div class="breadcrumb"><span id="singleIcon" class="file-icon file" aria-hidden="true"></span><span id="singleName"></span></div>
        <button id="downloadSingle" class="primary" type="button">下载文件</button>
      </div>
      <div id="fileListHeader" class="file-list-header hidden" aria-label="文件列表表头">
        <span aria-hidden="true"></span>
        <div class="share-column-header" data-share-column="name">名称</div>
        <div class="share-column-header" data-share-column="meta">大小</div>
        <div class="share-column-header" data-share-column="action">操作</div>
      </div>
      <div id="fileList" class="file-list"></div>
      <p id="shareMessage" class="message" role="alert"></p>
    </section>
  </main>
  <script src="/assets/file-icons.js?v=static-1"></script>
  <script src="/assets/share.js?v=static-1"></script>
</body>
</html>
